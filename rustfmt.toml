# rust-quality — shared rustfmt configuration.
#
# STABLE OPTIONS ONLY. rustfmt silently ignores unstable keys on the stable
# channel, so a config full of nightly options formats nothing and everyone
# believes they are covered.
#
# The two everybody reaches for — `imports_granularity` and `group_imports` —
# are still nightly-gated as of 2026-09 with no stabilization in sight. Do not
# add them: either the whole fleet moves to a nightly rustfmt, or import
# grouping stays a review concern. See docs/RUST.md.
#
# NO `edition` OR `style_edition`. `cargo fmt` reads the edition from each
# crate's own manifest and passes it through, so pinning one here does nothing
# for a crate already on that edition and rewrites every file of one that is
# not. A shared config that reformats a 2021 crate the moment it is copied in
# is not shared config, it is a migration nobody asked for. The four keys below
# carry no edition assumption.

max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
