[package]
name = "anchor"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "A local daemon that owns long-running PTY processes"
repository = "https://github.com/alehatsman/anchor"
publish = false

[[bin]]
name = "anchord"
path = "src/bin/anchord.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
parking_lot = "0.12.5"
portable-pty = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"

# The Windows arm of the PTY layer, the named-pipe transport and the owner-only
# ACLs (docs/09-windows.md). Already in the tree through tokio, at this version.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
