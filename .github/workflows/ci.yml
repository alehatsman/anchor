name: ci

# Every check this repo has used to run only when someone remembered to run
# it (#17). docs/08-testing.md's thesis is that a claim nothing can falsify
# is not evidence; a suite that passes on one laptop is the same shape.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned rather than floating to stable. teleport's CI drifted to a newer
  # compiler than any developer was running and went red on clippy lints
  # nobody could reproduce locally (#16). Bump this deliberately.
  RUST_VERSION: 1.98.1
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install $RUST_VERSION --profile minimal --component rustfmt
      - run: rustup default $RUST_VERSION
      # fmt was dirty across ten files before anything checked it, and not
      # one of them was a judgement call.
      - run: cargo fmt --check

  test:
    # Both platforms, deliberately. tests/pty_primitive.rs splits on
    # target_os for a real kernel difference in disassociate_ctty(), so a
    # single-platform job silently stops covering half of it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install $RUST_VERSION --profile minimal --component clippy
      - run: rustup default $RUST_VERSION
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      # Clippy on both too: the platform conditionals live in pty.rs, and a
      # lint that only fires under one cfg is only seen under one runner.
      - run: cargo clippy --all-targets -- -D warnings
      # `cargo test` is green when a suite is cfg-gated down to nothing -- the
      # history the comment on the clippy step above describes. Count what
      # would run, the way scripts/check-citations.py refuses to pass having
      # found no citations. The floor is deliberately below today's count
      # (169 on both runners at the time of writing): it exists to catch a suite vanishing, not to
      # make deleting a test a CI edit. Raise it when the count grows.
      - name: the suite must not pass by not running
        shell: bash
        run: |
          cargo test -- --list 2>/dev/null | grep ': test$' > tests.list
          n=$(wc -l < tests.list)
          echo "$n tests listed on $RUNNER_OS"
          [ "$n" -ge 140 ] || { echo "::error::only $n tests listed; a suite is gated out"; exit 1; }
          # The two halves of the disassociate_ctty() split, each on its own OS.
          case "$RUNNER_OS" in
            Linux) want=eof_and_exit_are_independent_signals ;;
            macOS) want=eof_follows_the_session_leaders_exit_even_with_a_live_grandchild ;;
            *) echo "::error::unexpected runner OS $RUNNER_OS"; exit 1 ;;
          esac
          grep -q "^$want: test$" tests.list || { echo "::error::$want is not listed on $RUNNER_OS"; exit 1; }
      - run: cargo test

  windows:
    # Its own job rather than a third matrix entry: the Unix job's coverage
    # step names one fixture per kernel and refuses any other runner, which
    # is the right answer for it. docs/09-windows.md §5 is the order this
    # job grows in, and its first obligation is to be able to go red at all.
    #
    # Gate 1, 2026-10-19: red before anything was ported, and red the way it
    # should be -- `cargo clippy` failed to compile the library (39 errors:
    # the unix-only `pty` module, `tokio::net::UnixStream`, termios,
    # `PermissionsExt`). Reproduced by running these steps on a real Windows
    # 11 box (build 26200). Every later gate was run there the same way
    # before it was committed; the first run of this job on GitHub is still
    # to come.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy
      - run: rustup default $env:RUST_VERSION
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-latest-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --all-targets -- -D warnings
      # Every ConPTY fixture writes its own name here as its last statement,
      # and the step after this one refuses to pass unless each fixture the
      # binary lists did. RUNNER_TEMP is fresh per job, which matters: a
      # stale ledger would vouch for fixtures that have stopped running.
      - name: cargo test
        run: cargo test
        env:
          ANCHOR_CONPTY_LEDGER: ${{ runner.temp }}\conpty.ledger
      # docs/09-windows.md §5 step 3: an ungated assertion that the Windows
      # fixtures executed. A count gate cannot do this -- the count is never
      # zero -- and `cargo test` alone reports a gated-out or early-returning
      # fixture as nothing at all, or as ok.
      - name: the ConPTY fixtures must have run, not merely passed
        run: cargo test --test pty_primitive_windows -- --ignored --exact every_conpty_fixture_ran_to_completion
        env:
          ANCHOR_CONPTY_LEDGER: ${{ runner.temp }}\conpty.ledger

  citations:
    # Twenty-five doc citations pointed at headings that do not exist before
    # anything read them (#17).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-citations.py
